<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bombGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark tactical badge container -->
  <rect width="64" height="64" rx="14" fill="#090d14"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Tactical Reticle Ticks -->
  <line x1="8" y1="37" x2="13" y2="37" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="51" y1="37" x2="56" y2="37" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="56" x2="32" y2="60" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Bomb Collar -->
  <rect x="25.5" y="16.5" width="11" height="5" rx="1.5" fill="#64748b" stroke="#0f172a" stroke-width="1" transform="rotate(-14 31 19)"/>

  <!-- Fuse -->
  <path d="M 32 17 C 35 12, 38 8, 44 9" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Spark Blast / Flash -->
  <circle cx="44" cy="9" r="8" fill="url(#sparkGlow)"/>
  <path d="M 44 2 L 46 7.5 L 51 9 L 46 10.5 L 44 16 L 42 10.5 L 37 9 L 42 7.5 Z" fill="#facc15" filter="url(#glow)"/>
  <circle cx="44" cy="9" r="2" fill="#ffffff"/>

  <!-- Main Bomb Sphere -->
  <circle cx="31" cy="37" r="18" fill="url(#bombGrad)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Sphere Highlight Arc -->
  <path d="M 20 28 A 14 14 0 0 1 36 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <!-- Digital Countdown Display -->
  <rect x="20" y="31.5" width="22" height="11.5" rx="2" fill="#020617" stroke="#0ea5e9" stroke-width="1"/>
  <text x="31" y="40" fill="#f43f5e" font-family="Courier New, monospace" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">00.7</text>
</svg>
